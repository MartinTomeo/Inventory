<div class="hero bg-base-200 min-h-screen">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold">Ingresa Ahora!</h1>
      <p class="py-6">Aplicacion de inventario y mantenimiento de ABMs</p>
    </div>
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <div class="card-body">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="on" class="login-form">
          <fieldset class="fieldset">
            <label class="label">Email</label>
            <input type="email" class="input" placeholder="Email" formControlName="email" />
            @if(fieldErrors()['email']!==null && isSubmitted()){
              <span class="text-error">{{ fieldErrors()['email'] }}</span>
            }
            <label class="label">Password</label>
            <input type="password" class="input" placeholder="Password" formControlName="password" />
            @if(fieldErrors()['password']!==null && isSubmitted()){
              <span class="text-error">{{ fieldErrors()['password'] }}</span>
            }
          </fieldset>
          <button class="btn btn-neutral mt-4 w-full" type="submit">Login</button>
        </form>
      </div>
    </div>
  </div>

  @if(hasError()){
    <div role="alert" class="alert alert-error animate-fadeIn fixed bottom-4 right-4 z-50 flex items-center gap-2 rounded-lg border border-error bg-error/20 px-4 py-3 text-sm text-error shadow-lg">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Error! Revise los valores del formulario</span>
    </div>
  }

</div>
