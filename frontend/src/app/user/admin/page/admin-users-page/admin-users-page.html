<div class="flex flex-col h-screen gap-4 p-4">

  <!-- Search -->
  <section>
    <admin-search-input
      placeholder="Buscar por nombre de usuario"
      (value)="query.set($event)" />
  </section>

  <!-- Main content -->
  <div class="flex gap-2 flex-1 min-h-0">

    <!-- Users List (2/3) -->
    <section class="w-2/3 flex-col">
      <admin-users-list [usersResource]="usersResource" (value)="selectedUserId.set($event)" />
    </section>

    <!-- User Form (1/3) -->
    <section class="w-1/3">
      <admin-users-form [userResource]="selectedUserResource" />
    </section>

  </div>

</div>
