<table class="table">
  <thead>
    <tr class="bg-base-200">
      <th>#</th>
      <th>Username</th>
      <th>Email</th>
      <th>Line</th>
      <th>IMEI</th>
      <th>Last Update</th>
    </tr>
  </thead>

  <tbody>
    <tr
      class="hover cursor-pointer"
      onclick="
        document.getElementById('row1-details').open = !document.getElementById('row1-details').open
      "
    >
      <td>
        <input type="checkbox" class="checkbox" onclick="event.stopPropagation()" />
      </td>
      <td>Cy Ganderton</td>
      <td>cy.ganderton@example.com</td>
      <td>+54 11 1234-5678</td>
      <td>356789123456789</td>
      <td>19/09/2025</td>
    </tr>

    <!-- Details Row -->
    <tr>
      <td colspan="6" class="p-0">
        <details id="row1-details" class="collapse bg-base-100">
          <summary class="hidden"></summary>

          <div class="collapse-content p-6">
            <div class="grid gap-6">
              <!-- Images -->
              <div class="flex justify-center gap-12">
                <!-- User Avatar -->
                <div class="flex flex-col items-center">
                  <label class="label font-semibold">User Image</label>

                  <div class="avatar">
                    <div
                      class="w-32 rounded-xl ring ring-primary ring-offset-base-100 ring-offset-2"
                    >
                      <img  alt="User Image" />
                    </div>
                  </div>

                  <input type="file" id="userImage" accept="image/*" class="hidden" />

                  <button
                    type="button"
                    class="btn btn-outline btn-sm mt-3"
                    onclick="document.getElementById('userImage').click()"
                  >
                    Change User Image
                  </button>
                </div>

                <!-- Phone Avatar -->
                <div class="flex flex-col items-center">
                  <label class="label font-semibold">Phone Image</label>

                  <div class="avatar">
                    <div
                      class="w-32 rounded-xl ring ring-secondary ring-offset-base-100 ring-offset-2"
                    >
                      <img alt="Phone Image" />
                    </div>
                  </div>

                  <input type="file" id="phoneImage" accept="image/*" class="hidden" />

                  <button
                    type="button"
                    class="btn btn-outline btn-sm mt-3"
                    onclick="document.getElementById('phoneImage').click()"
                  >
                    Change Phone Image
                  </button>
                </div>
              </div>

              <!-- Fields -->
              <fieldset class="grid grid-cols-3 gap-4">
                <div>
                  <label class="label">Username</label>
                  <input class="input w-full editable-field" value="Cy Ganderton" readonly />
                </div>

                <div>
                  <label class="label">Email</label>
                  <input
                    class="input w-full editable-field"
                    value="cy.ganderton@example.com"
                    readonly
                  />
                </div>

                <div>
                  <label class="label">Line</label>
                  <input class="input w-full editable-field" value="+54 11 1234-5678" readonly />
                </div>

                <div>
                  <label class="label">IMEI</label>
                  <input class="input w-full editable-field" value="356789123456789" readonly />
                </div>

                <div>
                  <label class="label">Model</label>
                  <input class="input w-full editable-field" value="Galaxy S24" readonly />
                </div>
                <div>
                  <label class="label">Brand</label>
                  <input class="input w-full editable-field" value="Samsung" readonly />
                </div>
                <div>
                  <label class="label">
                    <span class="label-text">Mobile Provider</span>
                  </label>
                  <select class="select select-bordered w-full editable-field">
                    <option disabled>Select provider</option>
                    <option selected>Personal</option>
                    <option>Movistar</option>
                    <option>Claro</option>
                  </select>
                </div>
                <div>
                  <label class="label">
                    <span class="label-text">Line Provider</span>
                  </label>
                  <select class="select select-bordered w-full editable-field">
                    <option disabled>Select provider</option>
                    <option selected>Personal</option>
                    <option>Telecom</option>
                    <option>iPlan</option>
                  </select>
                </div>
                <!-- Action Buttons -->
                <div class="col-span-3 flex justify-between items-center border-t pt-4 mt-2">
                  <div>
                    <span class="font-semibold">Last Update:</span>
                    <span class="badge badge-neutral ml-2"> 19/09/2025 14:35:22 </span>
                  </div>
                  <div class="flex gap-2">
                    <button
                      class="btn btn-primary"
                      onclick="toggleEdit(event, 'row1-details', this)"
                    >
                      Edit
                    </button>
                    <button class="btn btn-success" onclick="event.stopPropagation()">Save</button>
                  </div>
                </div>
              </fieldset>
            </div>
          </div>
        </details>
      </td>
    </tr>
  </tbody>
</table>
